services:
  - type: web
    name: jaboncontrol
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEMO_DATA
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_COOKIE_ONLY
        value: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PG_POOL_MAX
        value: 5
      - key: JWT_EXPIRE
        value: 7d
      - key: PASSWORD_MAX_DAYS
        value: 180
